[package]
name = "molt"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
default-run = "molt"

[lib]
name = "molt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "molt"
path = "src/main.rs"

[[bin]]
name = "fixtures_demo"
path = "src/bin/fixtures_demo.rs"
required-features = ["testkit"]

[dependencies]
dirs = "7.0.0"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0.0-rc.8"
thiserror = "2.0.21"
trash = "5.2.9"
window-vibrancy = "0.8.1"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test", "macos-private-api"] }
tempfile = "3.27.0"

[features]
testkit = []
